spring:
  # datasource는 AbstractIntegrationTest가 @DynamicPropertySource로 Testcontainers MySQL
  # 주소를 넣어준다 — 여기엔 안 적는다.
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

mongle:
  jwt:
    secret: test-only-secret-key-not-for-production-use-0123456789
    expiration-days: 365
  gemini:
    api-key: ""
    model: gemini-3.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-ms: 8000
  reflections:
    max-per-session: 20
  risk:
    keywords: 자살,죽고싶,죽어버리,자해,자해하고,손목,칼로,사라지고싶,목매,번개탄,투신,극단적 선택,때렸,폭행,맞았,맞고,스토킹,미행,쫓아온다,따라온다,찾아올까봐,협박,죽인다,죽일거야
  memory:
    soft-limit: 30
    preview-ttl-minutes: 30
  session:
    expire-after-hours: 24
